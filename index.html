<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>인테리어필름계산기 v3.5 (Onu Standard UI)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f1f5f9; --card: #ffffff;
            --text: #0f172a; --text-muted: #64748b; --input-bg: #f8fafc; --border: #cbd5e1;
            --nav-bg: rgba(255, 255, 255, 0.95); --error: #ef4444; --success: #10b981;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
            --input-bg: #0f172a; --border: #334155; --nav-bg: rgba(30, 41, 59, 0.95);
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; color: var(--text); transition: background 0.3s ease, color 0.3s ease; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; position: relative; padding-bottom: 30px; }
        .tab-header { display: flex; background: var(--nav-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 16px 0; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; position: relative; }
        .tab-btn::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 0; height: 3px; background: var(--primary); transition: width 0.3s ease; border-radius: 3px 3px 0 0; }
        .tab-btn.active { color: var(--primary); font-weight: 700; }
        .tab-btn.active::after { width: 100%; }
        .tab-content { display: none; padding: 20px 15px; animation: fadeIn 0.2s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        h3 { margin: 0 0 14px 0; font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; letter-spacing: -0.3px; }
        input { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 14px; width: 100%; box-sizing: border-box; transition: all 0.2s ease; }
        .area-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .area-block { position: relative; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--input-bg); }
        .remove-btn { position: absolute; top: -10px; right: -10px; background: var(--error); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3); z-index: 10; }
        .area-inputs { display: flex; gap: 10px; margin-top: 8px; }
        .area-inputs input { flex: 1; min-width: 0; text-align: center; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.2s; margin-top: 12px; }
        .btn-sub { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 12px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; flex: 1; text-align: center; }
        .doc-preview { background: var(--card); padding: 20px; border-radius: 10px; font-size: 13px; color: var(--text); line-height: 1.6; border: 1px solid var(--border); }
    </style>
</head>
<body data-theme="light">
<div class="container">
    <div class="tab-header">
        <button class="tab-btn active" onclick="switchTab('calcTab')">계산기</button>
        <button class="tab-btn" onclick="switchTab('historyTab')">기록</button>
        <button class="tab-btn" onclick="switchTab('configTab')">설정</button>
    </div>
    <div id="calcTab" class="tab-content active">
        <div class="card">
            <h3>프로젝트 현장명</h3>
            <input type="text" id="projectName" placeholder="예: 강남 아파트" oninput="saveTempData()">
        </div>
        <div class="card">
            <h3>시공 면적 <button onclick="addArea()" style="padding:6px 12px; background:var(--text); color:white; border:none; border-radius:6px; cursor:pointer; font-size:12px;">+ 추가</button></h3>
            <div id="areas" class="area-grid"></div>
        </div>
        <button class="btn-main" onclick="calculate()">물량 산출 및 기록 저장</button>
        <div id="resultSection" style="display:none; margin-top:24px;">
            <div id="documentSection" class="doc-preview"></div>
            <div style="display:flex; gap:10px; margin-top:12px;">
                <button class="btn-sub" onclick="saveImage('documentSection')">PNG 다운로드</button>
                <button class="btn-sub" onclick="shareResult('documentSection')">결과 공유하기</button>
            </div>
        </div>
    </div>
    <div id="historyTab" class="tab-content"><div id="historyList"></div></div>
    <div id="configTab" class="tab-content">
        <div class="card">
            <h3>기본 로스율 (%)</h3>
            <input type="number" id="globalLossRate" value="10" oninput="saveTempData()">
        </div>
        <button class="btn-sub" style="width:100%; background:var(--text); color:var(--card);" onclick="toggleTheme()">🌓 다크/라이트 모드 전환</button>
    </div>
</div>
<script>
    let areaCount = 0;
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }
    function addArea(title = "", w = "", h = "") {
        areaCount++;
        const id = `area_${areaCount}`;
        const html = `
        <div class="area-block" id="${id}">
            <button class="remove-btn" onclick="document.getElementById('${id}').remove(); saveTempData();">×</button>
            <input type="text" placeholder="공간명" value="${title}" oninput="saveTempData()">
            <div class="area-inputs">
                <input type="number" step="0.1" placeholder="가로(m)" value="${w}" oninput="saveTempData()">
                <input type="number" step="0.1" placeholder="세로(m)" value="${h}" oninput="saveTempData()">
            </div>
        </div>`;
        document.getElementById('areas').insertAdjacentHTML('beforeend', html);
    }
    function calculate() {
        const projName = document.getElementById('projectName').value || "미지정 현장";
        document.getElementById('documentSection').innerHTML = `<strong>${projName}</strong>의 물량 산출서가 생성되었습니다.`;
        document.getElementById('resultSection').style.display = 'block';
    }
    function saveTempData() {}
    function toggleTheme() {
        const body = document.body;
        const newTheme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', newTheme);
    }
    function saveImage(id) { alert('이미지 저장 기능을 호출합니다.'); }
    function shareResult(id) { alert('공유 기능을 호출합니다.'); }
    window.onload = () => { addArea('주방가구', '2.4', '0.8'); };
</script>
</body>
</html>
