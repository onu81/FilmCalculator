<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>필름 계산기 v3.1 (글로벌 플랫폼 연동형)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    /* ADHD/HSP 친화적 저자극 팔레트 */
    :root {
        --primary: #10b981; 
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1e293b;
        --border: #e2e8f0;
        --nav-bg: #ffffff;
        --error: #ef4444;
        --success: #059669;
    }

    [data-theme="dark"] {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --border: #334155;
        --nav-bg: #1e293b;
    }

    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; color: var(--text); transition: background 0.2s, color 0.2s; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: sticky; top: 0; background: var(--nav-bg); padding: 10px 0; z-index: 10; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; margin: 0; font-weight: 700; color: var(--primary); }
    .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: var(--text); opacity: 0.8; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 16px; box-sizing: border-box; background: var(--card); color: var(--text); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; margin-bottom: 10px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .result-area { display: none; margin-top: 24px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .summary-item { background: var(--bg); padding: 12px; border-radius: 8px; text-align: center; }
    .summary-label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 4px; }
    .summary-value { font-size: 1rem; font-weight: 700; }
    .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
    .tag-primary { background: #dcfce7; color: #166534; }
    .theme-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 5px; }
    footer { text-align: center; font-size: 0.75rem; opacity: 0.5; margin-top: 40px; padding-bottom: 20px; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>FILM CALC <small style="font-size: 0.7rem; font-weight: normal; opacity: 0.6;">v3.1</small></h1>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="테마 변경">🌙</button>
    </header>

    <div class="card">
        <label>🏠 현장명</label>
        <input type="text" id="siteName" placeholder="예: 한강자이 101동">

        <label>📐 면적 (평형)</label>
        <select id="size">
            <option value="20">20평형 (기본)</option>
            <option value="25">25평형 (표준)</option>
            <option value="30">30평형 (추천)</option>
            <option value="34">34평형 (최대)</option>
        </select>

        <label>📋 작업 범위</label>
        <select id="scope">
            <option value="basic">기본 (문/틀 + 새시)</option>
            <option value="full">전체 (기본 + 걸레받이/등박스)</option>
            <option value="premium">프리미엄 (전체 + 붙박이장/싱크대)</option>
        </select>

        <button class="btn btn-primary" onclick="calculate()">물량 산출 및 저장</button>
    </div>

    <div id="resultArea" class="result-area">
        <div class="card" id="captureTarget" style="padding: 24px;">
            <div class="tag tag-primary">산출서 NO. <span id="resId"></span></div>
            <h2 id="resSite" style="margin: 0 0 16px 0; font-size: 1.5rem;"></h2>
            
            <div style="border-top: 2px solid var(--border); padding-top: 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span>총 예상 필름량</span>
                    <strong style="color: var(--primary);"><span id="resFilm"></span> M</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                    <span>예상 소요 인원</span>
                    <strong><span id="resLabor"></span> 명</strong>
                </div>
            </div>

            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-label">필름 (폭 122cm)</div>
                    <div class="summary-value">약 <span id="resFilmDetail"></span>m</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">프라이머</div>
                    <div class="summary-value">약 <span id="resPrimer"></span>L</div>
                </div>
            </div>
            
            <div style="margin-top: 16px; font-size: 0.8rem; opacity: 0.6; line-height: 1.4;">
                * 본 산출량은 표준 데이터를 기반으로 한 예측치입니다.<br>
                * 현장 상황 및 자재 무늬 방향에 따라 ±15% 오차가 발생할 수 있습니다.
            </div>
        </div>

        <button class="btn btn-primary" onclick="shareResult('captureTarget')">결과 공유하기 (카톡/이미지)</button>
        <button class="btn btn-outline" onclick="saveToDevice()">갤러리에 이미지로 저장</button>
        <button class="btn btn-outline" style="border-color: #ccc; color: #666;" onclick="reset()">다시 계산</button>
    </div>

    <footer>
        © 2024 Film Calculator Professional. All rights reserved.
    </footer>
</div>

<script>
// 테마 관리
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const target = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', target);
    document.querySelector('.theme-toggle').innerText = target === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('film_theme', target);
}

// 초기 테마 로드
if (localStorage.getItem('film_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.querySelector('.theme-toggle').innerText = '☀️';
}

// 계산 로직
function calculate() {
    const site = document.getElementById('siteName').value || "미지정 현장";
    const size = parseInt(document.getElementById('size').value);
    const scope = document.getElementById('scope').value;

    let multiplier = 1.0;
    if(scope === 'full') multiplier = 1.4;
    if(scope === 'premium') multiplier = 1.9;

    const film = Math.ceil(size * 1.2 * multiplier);
    const labor = (film / 15).toFixed(1);
    const primer = (film * 0.15).toFixed(1);

    document.getElementById('resId').innerText = Math.floor(Math.random() * 9000) + 1000;
    document.getElementById('resSite').innerText = site;
    document.getElementById('resFilm').innerText = film;
    document.getElementById('resFilmDetail').innerText = film;
    document.getElementById('resLabor').innerText = labor;
    document.getElementById('resPrimer').innerText = primer;

    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

function reset() {
    if(confirm('데이터를 초기화하시겠습니까?')) {
        location.reload();
    }
}

// [수정된 핵심 함수] 안드로이드 앱 연동 이미지 공유
function shareResult(id) {
    const element = document.getElementById(id);
    if (!element) return;

    // 버튼 상태 변경
    const btn = event ? event.currentTarget : null;
    const originalText = btn ? btn.innerText : "결과 공유하기 (카톡/이미지)";
    if (btn) {
        btn.innerText = "이미지 생성 중...";
        btn.disabled = true;
    }

    html2canvas(element, { 
        scale: 2, 
        backgroundColor: document.documentElement.getAttribute('data-theme') === 'dark' ? '#1e293b' : '#ffffff',
        useCORS: true 
    }).then(canvas => {
        const base64Image = canvas.toDataURL('image/png');

        // 1. 안드로이드 앱 브릿지 확인 (window.Android는 사용자님이 스튜디오에서 정의한 이름)
        if (window.Android && typeof window.Android.shareImage === 'function') {
            window.Android.shareImage(base64Image);
        } 
        // 2. 일반 모바일 브라우저 공유 API
        else if (navigator.share) {
            canvas.toBlob(blob => {
                if (!blob) return;
                const file = new File([blob], `필름산출서_${Date.now()}.png`, { type: 'image/png' });
                navigator.share({
                    files: [file],
                    title: '필름 물량 산출 결과'
                }).catch(err => {
                    console.error("공유 실패:", err);
                    downloadFallback(base64Image);
                });
            });
        } 
        // 3. PC 브라우저 등 다운로드로 대체
        else {
            downloadFallback(base64Image);
        }

        if (btn) {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }).catch(err => {
        console.error("html2canvas 에러:", err);
        alert("이미지 생성에 실패했습니다.");
        if (btn) {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    });
}

// 갤러리 저장용 (이것도 안드로이드 스튜디오의 saveBase64Image와 연동될 수 있음)
function saveToDevice() {
    const element = document.getElementById('captureTarget');
    html2canvas(element, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
        const base64Image = canvas.toDataURL('image/png');
        
        // 안드로이드 앱의 다운로드 리스너 활용
        const link = document.createElement('a');
        link.href = base64Image;
        link.download = `필름산출서_${Date.now()}.png`;
        link.click();
    });
}

function downloadFallback(url) {
    const link = document.createElement('a');
    link.href = url;
    link.download = `필름산출서_${Date.now()}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
